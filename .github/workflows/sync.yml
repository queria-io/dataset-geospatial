name: Apply

on:
  push:
    branches: [main]
  # Project LINKS のデータの更新は不定期なので、定期実行はしない。更新されたら手で回す
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う
    permissions:
      contents: read
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@4008bbec3bf8c5aad513b18c018b14d077e92920
    with:
      dataset_name: geospatial
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
