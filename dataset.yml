name: geospatial
title: G空間情報センター
description: |-
  G空間情報センター（https://www.geospatial.jp/）で公開されているデータを、SQL で集計・地図表示できるテーブルにしたデータセットです。

  links スキーマには、国土交通省 総合政策局 情報政策課が Project LINKS で行政手続の報告書や申請書をデータ化して公開したデータを収録しています。観光統計、無人航空機の事故と空域、路線バス・貸切バス・タクシー、自家用有償旅客運送、レンタカー、貨物自動車運送事業、自動車運送事業の事故、鉄道統計年報、内航海運業と船員、一般旅客定期航路と船舶事故、モーダルシフト、倉庫業、空き家・空き地バンクの 2024・2025 年度の公開分です。

  people_flow スキーマには、国土交通省の「全国の人流オープンデータ」を収録しています。2019〜2021 年の月ごとの滞在人口で、全国の 1km メッシュ別と、市区町村別に滞在者の居住地で分けたものがあり、平日・休日と昼・深夜で分かれています。スマートフォンの位置情報から Agoop が推計した値です。

  chizu スキーマには、法務省の登記所備付地図データを収録しています。全国の筆（土地の 1 区画）ごとに地番・座標系・精度区分を持ち、公共座標の図面の筆は形と代表点の緯度経度を持ちます。

  links スキーマの事業者は新しく付けた ID で表され、多くの数値は 10 段階のランク（「9.0以上～12.0未満」など）や都道府県・市区町村の単位に秘匿化されています。対象の地域や期間はファイルごとに違い、全国の一部を抜き出したサンプルもあります。各テーブルの説明を確認してから使ってください。

  出典：
  - links: Project LINKS（国土交通省）（https://www.mlit.go.jp/links/）のオープンデータ（G空間情報センター https://www.geospatial.jp/ckan/organization/sosei-joho）を加工して作成
  - people_flow: 「全国の人流オープンデータ」（国土交通省）（https://www.geospatial.jp/ckan/dataset/mlit-1km-fromto）を加工して作成
  - chizu: 「登記所備付地図データ」（法務省）を加工して作成。市区町村ごとのデータ名と URL は chizu.source にあります
