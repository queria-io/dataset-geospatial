[project]
name = "dataset-geospatial"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fdl-cli>=0.19.0",
    "dbt-core>=1.11.2",
    "dbt-duckdb>=1.10.0",
    "openpyxl>=3.1",
    "mojxml>=0.5.4",
    "lxml>=5",
    "pyarrow>=18",
    "shapely>=2",
]

[dependency-groups]
dev = ["duckdb>=1.4", "pyyaml>=6"]
