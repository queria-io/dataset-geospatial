schema: links
name: railway_balance_sheet
title: 鉄道統計年報 貸借対照表
description: |-
  貸借対照表は、流動資産、固定資産、繰延資産、資産合計、流動負債、固定負債、引当金、負債合計、資本金、法定余剰金、利益余剰金、資本合計に関する情報を有するデータです。(2,308レコード)

  元の資料: 鉄道統計年報

  G空間情報センターのデータセット links-tetsudoujigyou-2025 の 06_tetsudou_taisyakutaisyouhyou.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
sources:
- path: https://www.geospatial.jp/ckan/dataset/links-tetsudoujigyou-2025
