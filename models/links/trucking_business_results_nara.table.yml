schema: links
name: trucking_business_results_nara
title: 貨物自動車運送事業の事業実績報告書（奈良運輸支局管内、2023年度）
description: |-
  奈良運輸支局管内の事業者を対象とした、事業用車両数や運転者数、地方別の走行キロ・実車キロ/実運送・利用運送/営業収入等の事業実績に関する情報を有するデータ(223レコード)

  G空間情報センターのデータセット links-kamotsujidousyaunsojigyo-2025 の 01_jigyoujissekihoukokusyo_2025.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
