schema: links
name: rideshare_transport_results
title: 自家用有償旅客運送輸送実績報告書
description: |-
  本データは、東京運輸支局及び徳島運輸支局、長崎運輸支局の運送者(29件)を対象に、2020~2024年度における自家用有償旅客運送自動車数(寝台車、車いす車、兼用車、回転シート車、セダン等、バスの別)、走行キロ、輸送人員、運送収入、交通事故・重大事故件数、死者数、負傷者数に関する情報をデータ化したものです。(29レコード)

  元の資料: 自家用有償旅客運送輸送実績報告書

  G空間情報センターのデータセット links-rideshare-2025 の 01_jikayouyuushouryokyakuunsou_yusoujissekihoukokusho.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
sources:
- path: https://www.geospatial.jp/ckan/dataset/links-rideshare-2025
