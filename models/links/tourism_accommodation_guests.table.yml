schema: links
name: tourism_accommodation_guests
title: 宿泊旅行統計調査（都道府県別の延べ宿泊者数）
description: |-
  宿泊旅行統計調査データをもとに、都道府県単位で従業者規模別・滞在目的別(観光目的50%未満/以上による区分)の延べ宿泊者数を国内外旅行者の区分で、2021~2024年の時系列に集計を行いデータ化したものです(188レコード)。

  元の資料: 宿泊旅行統計調査

  G空間情報センターのデータセット links_kankoutoukei_2025 の 01_syukuhakuryokoutoukeityousa.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
sources:
- path: https://www.geospatial.jp/ckan/dataset/links_kankoutoukei_2025
