schema: links
name: railway_transport_volume
title: 鉄道統計年報 運輸成績表（数量）
description: |-
  運輸成績表(数量)は、輸送人員(定期:通勤・通学、定期外)、手小荷物個数、輸送トン数(コンテナ、車扱)に関する情報を有するデータです。(3,688レコード)

  元の資料: 鉄道統計年報

  G空間情報センターのデータセット links-tetsudoujigyou-2025 の 01_tetsudou_unyuseiseki1.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
sources:
- path: https://www.geospatial.jp/ckan/dataset/links-tetsudoujigyou-2025
fields:
