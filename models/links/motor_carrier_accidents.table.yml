  description: '秘匿化: 秘匿化有 (キーワード分類)。当時の状況に関する主要なキーワード分類を以下の8分類から最大3つ付与 1)車両状況 : オーバーヒート警告、ベルト異常、ブレーキ異常 等 2)負傷者状況 : 怪我、体調不良、緊急搬送 等 3)事故状況 : 横転事故、自動車事故、夜間 等 4)報告・記録・点検状況 : 整備実施、運行管理、点検不良 等 5)運転状況 : 運転ミス、居眠り運転、速度違反 等 6)乗客対応 : 乗降作業、振替輸送、安全確保 等 7)運行状況 : 運行計画、運行中止、運行遅延 等 8)その他 : 1)~7)以外の内容'
