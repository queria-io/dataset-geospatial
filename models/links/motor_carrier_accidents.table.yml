- name: prevention_measure_keyword_category_1
  title: 再発防止対策_大分類1
  description: '秘匿化: 秘匿化有 (キーワード分類)。再発防止対策に関する主要なキーワード分類を以下の6分類から最大3つ付与 1)車両点検・検査 : 車両の定期・日常点検、各部品の点検・メンテナンス 等 2)車両整備・管理・部品交換 : 車両の不具合整備・定期整備、各部品の交換・交換時期の管理 等 3)報告・記録・調査 : 整備管理者への報告、管理表記録、原因調査 等 4)運転・ドライバー : 運転指導・周囲確認、体調管理・運転適性確認、ドライブレコーダー映像の活用 等 5)社内教育・啓発 : 注意喚起、教育訓練、周知徹底・安全対策の徹底、啓発活動 等 6)その他 : 1)~5)以外の内容。値: 1)車両点検・検査 = 車両の定期・日常点検、各部品の点検・メンテナンス 等、2)車両整備・管理・部品交換 = 車両の不具合整備・定期整備、各部品の交換・交換時期の管理 等、3)報告・記録・調査 = 整備管理者への報告、管理表記録、原因調査 等、4)運転・ドライバー = 運転指導・周囲確認、体調管理・運転適性確認、ドライブレコーダー映像の活用 等、5)社内教育・啓発 = 注意喚起、教育訓練、周知徹底・安全対策の徹底、啓発活動 等、6)その他 = 1)~5)以外の内容'
- name: prevention_measure_keyword_category_2
  title: 再発防止対策_大分類2
  description: '秘匿化: 秘匿化有 (キーワード分類)。同上。値: 1)車両点検・検査 = 車両の定期・日常点検、各部品の点検・メンテナンス 等、2)車両整備・管理・部品交換 = 車両の不具合整備・定期整備、各部品の交換・交換時期の管理 等、3)報告・記録・調査 = 整備管理者への報告、管理表記録、原因調査 等、4)運転・ドライバー = 運転指導・周囲確認、体調管理・運転適性確認、ドライブレコーダー映像の活用 等、5)社内教育・啓発 = 注意喚起、教育訓練、周知徹底・安全対策の徹底、啓発活動 等、6)その他 = 1)~5)以外の内容'
