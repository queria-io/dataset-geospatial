schema: links
name: motor_carrier_accidents
title: 自動車運送事業の事故報告書と交通事故統計の統合データ
description: |-
  自動車運送事業の事故報告書の詳細情報(自動車運送事業における車両事故の概況(走行車両や事故状況、被害状況等)および事故に対する再発防止対策、ドライバーの運転状況・実績、当時の道路状況等の詳細情報)と交通事故統計情報(警察庁オープンデータ)に関する情報を統合したデータ(1,302レコード)

  元の資料: 自動車運送事業の事故報告書データ(別記様式(第3条関係)、別表2 運転者の健康状態に起因する事故等の調査事項、別表3 車両故障事故報告書添付票)、交通事故統計情報データ(警察庁オープンデータ)

  G空間情報センターのデータセット links-jidousyaunsoujigyoujiko-2025 の 01_jikohoukokusyo_koutsuujikotoukeijyouhou.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
sources:
- path: https://www.geospatial.jp/ckan/dataset/links-jidousyaunsoujigyoujiko-2025
