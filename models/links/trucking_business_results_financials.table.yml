schema: links
name: trucking_business_results_financials
title: 貨物自動車運送事業の事業実績と財務情報（全国のサンプル）
description: |-
  ファイル1の事業実績に関する情報と、営業費用、経常損益、流動・固定資産、負債・純資産等の財務情報を結合したデータ

  G空間情報センターのデータセット links-kamotsujidousyaunsojigyo-2024 の 02_jigyoujissekihoukokusyo_zaimujyouho.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
