schema: links
name: railway_operating_kilometers
title: 鉄道統計年報 営業キロ及び走行キロ
description: |-
  営業キロ及び走行キロは、年度末営業キロ(旅客・貨物)、自己・他鉄道車両自線走行キロ(機関車・旅客車・貨物車・特殊車)、自己車両他線走行キロ(機関車・旅客車・貨物車・特殊車)に関する情報を有するデータです。(3,865レコード)

  元の資料: 鉄道統計年報

  G空間情報センターのデータセット links-tetsudoujigyou-2025 の 03_tetsudou_eigyoukiro.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
sources:
- path: https://www.geospatial.jp/ckan/dataset/links-tetsudoujigyou-2025
