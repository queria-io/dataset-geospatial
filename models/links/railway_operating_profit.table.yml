schema: links
name: railway_operating_profit
title: 鉄道統計年報 鉄軌道業営業損益
description: |-
  鉄軌道業営業損益は、鉄軌道業営業収益(旅客収入・貨物収入・鉄道路線収入等)、鉄軌道業営業費(線路・電路・車両保存費・運転費・保守管理費等)、鉄道業営業損益、減価償却実施率に関する情報を有するデータです。(2,536レコード)

  元の資料: 鉄道統計年報

  G空間情報センターのデータセット links-tetsudoujigyou-2025 の 04_tetsudou_eigyousoneki.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
sources:
- path: https://www.geospatial.jp/ckan/dataset/links-tetsudoujigyou-2025
