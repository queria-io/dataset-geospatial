schema: links
name: railway_transport_distance
title: 鉄道統計年報 運輸成績表（延日キロ等）
description: |-
  運輸成績表(延日キロ等)は、延日キロ(旅客・貨物)、旅客人キロ(旅客・貨物、定期:通勤・通学、定期外)輸送トンキロ(コンテナ・車扱)、平均通過数量(旅客・貨物)、平均輸送キロ(旅客・貨物)に関する情報を有するデータです。(3,655レコード)

  元の資料: 鉄道統計年報

  G空間情報センターのデータセット links-tetsudoujigyou-2025 の 02_tetsudou_unyuseiseki2.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
sources:
- path: https://www.geospatial.jp/ckan/dataset/links-tetsudoujigyou-2025
