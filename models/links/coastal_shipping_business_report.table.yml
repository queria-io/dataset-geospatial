schema: links
name: coastal_shipping_business_report
title: 内航海運業の事業概況報告（2025年度公開）
description: |-
  内航海運業の概況報告として、船舶の用途や船質、進水年、総トン数・載貨重量トン、長さ、馬力等の船舶スペックや航路の起終点、資本金や営業収益等に関する情報を有するもので、2023年度以前の船舶データ(2,710レコード)

  元の資料: 内航海運業法登録申請書添付書類(5号様式)(使用船舶の明細)、内航海運業法登録申請書添付書類(6号様式)(内航貨物定期航路事業の明細)、内航海運業法事業概況(1号様式)(申請者の事業概要)、内航海運業事業概況報告書(2号様式)(内航海運業損益明細表)、内航海運業事業概況報告書(3号様式)(固定資産明細表)

  G空間情報センターのデータセット links-naikoukaiungyou-2025 の 01_naikoukaiungyou_jigyougaikyouhoukoku.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
sources:
- path: https://www.geospatial.jp/ckan/dataset/links-naikoukaiungyou-2025
