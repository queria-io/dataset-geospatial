schema: links
name: vacant_house_bank_contracts
title: 全国版空き家・空き地バンクの成約物件
description: |-
  成約物件データ(ファイル2)は買いたい・借りたい方とのマッチングや宅地建物取引業協会又は公益社団法人全日本不動産協会に交渉・契約の媒介を依頼(物件所有者の希望による)により取引が行われた情報(成約日、成約金額/賃料、物件種別、物件名、築年数、専有面積、交通機関、建物構造、管理形態、管理組合、私道負担、物件アピール、設備状況(水道、ガス等)、公共施設(病院、小学校等)への距離、容積率、建ぺい率等)に関する個別物件の情報です。(1,203レコード)。

  元の資料: 空き家・空き地バンク総合情報

  G空間情報センターのデータセット links-akiyabank-2025 の 02_seiyakubukken.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
