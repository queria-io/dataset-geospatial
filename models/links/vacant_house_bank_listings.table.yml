schema: links
name: vacant_house_bank_listings
title: 全国版空き家・空き地バンクの登録物件
description: |-
  登録物件データ(ファイル1)は売りたい・貸したい方の物件(価格/賃料、築年数、建物構造、専有面積、土地面積、土地権利、私道負担、セットバック、接道状況、駐車場、交通機関、病院や小学校等の主要施設への距離等)に関する個別物件情報です。(7,746レコード)。

  元の資料: 空き家・空き地バンク総合情報

  G空間情報センターのデータセット links-akiyabank-2025 の 01_tourokubukken.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
