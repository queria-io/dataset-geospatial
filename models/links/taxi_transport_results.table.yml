schema: links
name: taxi_transport_results
title: 一般乗用旅客自動車運送事業輸送実績報告（タクシー・ハイヤー）
description: |-
  タクシーの輸送実績は、事業用自動車数、従業員数、運転者数、走行キロ、実車キロ、輸送人員、実働率、運送回数、営業収入、実働社1日1車あたり営業収入、交通事故件数、重大事故件数、死者数、負傷者数、1人平均乗車キロ、輸送人キロ、平均乗車密度等の実績に関する情報を、ランク化及び偏差値により秘匿化したデータ化です。(924レコード)

  元の資料: 一般乗用旅客自動車運送事業輸送実績報告書

  G空間情報センターのデータセット links-ippanryokyaku-2025 の 03_ippanjyouyouryokyaku_yusoujisseki.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
sources:
- path: https://www.geospatial.jp/ckan/dataset/links-ippanryokyaku-2025
