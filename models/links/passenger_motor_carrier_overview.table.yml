schema: links
name: passenger_motor_carrier_overview
title: 一般旅客自動車運送事業の事業概況報告（乗合・貸切・乗用）
description: |-
  財務に関する事業概況報告書は、報告事業種別(路線バス、貸切バス、タクシー)、経営形態、資本金、発行済株式数、事業の名称、従業員数、営業収入、営業収益、営業費用、営業損益、営業外収益、営業外損益、特別損益、法人税、投資その他の資産等に関する情報を、ランク化及び偏差値により秘匿化したデータ化です。(1,036レコード)

  元の資料: 一般旅客自動車運送事業 事業概況報告書(乗合・貸切・乗用)

  G空間情報センターのデータセット links-ippanryokyaku-2025 の 04_ippanryokyakujidousya_jigyougaikyou.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
sources:
- path: https://www.geospatial.jp/ckan/dataset/links-ippanryokyaku-2025
