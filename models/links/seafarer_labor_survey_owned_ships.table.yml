schema: links
name: seafarer_labor_survey_owned_ships
title: 船員労働統計調査 第一号調査
description: |-
  第一号調査(漁船及び特殊船以外の船舶に乗り組む船員についての調査)を対象として、指定船舶の保有隻数・総トン数・稼働日数、船員数、船員の年齢・経験年数・労働時間・性別/外国人割合・年収等の平均値を年次別に集計したデータ(3レコード) ※船主団体名が別途資料である船舶明細書で特定・照合できた団体を対象として集計

  元の資料: 船員労働統計調査(第一号調査)

  G空間情報センターのデータセット links-naikoukaiungyou-2025 の 03_seninroudoutoukeityousa_1goutyousa.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
sources:
- path: https://www.geospatial.jp/ckan/dataset/links-naikoukaiungyou-2025
