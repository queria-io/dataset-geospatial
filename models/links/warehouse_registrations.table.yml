schema: links
name: warehouse_registrations
title: 倉庫業登録申請書と倉庫明細書（中部運輸局管内）
description: |-
  倉庫業登録申請(倉庫の所在地・種類、保管物品の種類、主要構造、建築年月、階数別面積等の規模、冷蔵施設等)に関する情報を有するデータ(4,876レコード)

  元の資料: 倉庫業登録申請書、倉庫明細書第1号様式、冷蔵施設明細書(冷蔵室表)、国土数値情報 行政区域データ

  G空間情報センターのデータセット links-soukogyou-2024 の 01_soukogyoutourokushinseisyo.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
sources:
- path: https://www.geospatial.jp/ckan/dataset/links-soukogyou-2024
