schema: links
name: rental_car_office_vehicles
title: 事務所別車種別配置車両数一覧（レンタカー）
description: |-
  本データは、全国の事務所を対象に、2024年度における乗用車、マイクロバス、トラック、特殊用途車、二輪車別の保有車両数、事業所数に関する情報をデータ化したものです。(14,934レコード)

  元の資料: 事務所別車種別配置車両数一覧(様式2)

  G空間情報センターのデータセット links-rentacars-2025 の 02_yousiki2_haisyasyaryousuu.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
sources:
- path: https://www.geospatial.jp/ckan/dataset/links-rentacars-2025
