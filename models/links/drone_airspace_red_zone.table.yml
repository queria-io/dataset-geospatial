title: 小型無人機等飛行禁止法のレッドゾーン
description: |-
  各種空域情報のうちレッドゾーンの情報を有するジオメトリデータ(主要8空港:8レコード)

  G空間情報センターのデータセット links-mujinkoukuukihikoukeikaku-2024 の 05_kakusyukuuikijyouhou_redzone.geojson を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
sources:
