schema: links
name: rental_car_results
title: 貸渡実績報告書（レンタカー）
description: |-
  本データは、全国の事務所を対象に、2023・2024年度における乗用車、マイクロバス、トラック、特殊用途車、二輪車別の車種別車両数、延貸渡回数、延貸渡日車数、延走行キロ、延貸渡料金に関する情報をデータ化したものです。(8,305レコード)

  元の資料: 貸渡実績報告書(様式1)、国土数値情報 行政ポリゴン

  G空間情報センターのデータセット links-rentacars-2025 の 01_yousiki1_kashiwatashijissekihoukokusho.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
sources:
- path: https://www.geospatial.jp/ckan/dataset/links-rentacars-2025
