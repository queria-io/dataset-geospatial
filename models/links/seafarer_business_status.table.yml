schema: links
name: seafarer_business_status
title: 船員法第111条に基づく事業状況報告（関東運輸局管内）
description: |-
  事業者別総積載率・内航船員1人・1時間当たり輸送量・平均総トン数、船員ベース労働生産性等関連指標、雇用船員数及び所属船舶の状況、従業制限、運航形態、操業区域、年齢別船員数、海技免状又は小型船舶操縦免許証受有船員数の雇入届出に関するデータ(162レコード)

  元の資料: 船員法第111条に基づく事業状況に関する報告(事業状況報告19号様式)

  G空間情報センターのデータセット links-naikoukaiungyou-2025 の 02_seninjoukyouhoukoku.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
sources:
- path: https://www.geospatial.jp/ckan/dataset/links-naikoukaiungyou-2025
