schema: links
name: motor_carrier_accident_reports
title: 自動車運送事業の事故報告書
description: |-
  自動車運送事業の事故報告書の概要情報(事故発生日時、車両概要・積載量等、事故発生までの乗務時間・距離、死亡者・重傷者数等)を有するデータ(494,308レコード、2003~2023年度の20年間)

  元の資料: 自動車運送事業の事故報告書データ(別記様式(第3条関係)、別表3 車両故障事故報告書添付票)

  G空間情報センターのデータセット links-jidousyaunsoujigyoujiko-2024 の 02_jikohoukokusyo.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
sources:
- path: https://www.geospatial.jp/ckan/dataset/links-jidousyaunsoujigyoujiko-2024
fields:
- name: occurrence_date_and_time
  title: 発生日時
- name: weather
  title: 天候
- name: location
  title: 発生場所
  description: 発生場所を番地まで記入
- name: latitude
  title: 緯度
  description: '単位: 度。発生場所住所代表地点の緯度を付与'
- name: longitude
  title: 経度
  description: '単位: 度。発生場所住所代表地点の緯度を付与'
- name: vehicle_id
  title: 自動車車両ID
- name: accident_type_category
  title: 事故の種類(区分)
  description: 衝突・転覆等の事象を複数選択
- name: order_of_accident_occurrence
  title: 事故発生順序
  description: 衝突・転覆等の事象を起こった順に記入
- name: fall_height
  title: 落差
  description: '単位: m。転落時の落差(路面から落下地点までの垂直距離)を記入'
- name: water_depth
  title: 水深
  description: '単位: m。転落時の水深(水中に転落した場合、路面から水面までの垂直距離)を記入'
- name: collision_condition
  title: 衝突時の状態
  description: 衝突の種類を選択
- name: vehicle_1_model_name
  title: 車両1:車名
  description: 車体のメーカー名を記入
- name: vehicle_1_model_type
  title: 車両1:型式
  description: 車体の型式を記入
- name: vehicle_1_body_type
  title: 車両1:車体形状
  description: 車体の形状を記入
- name: vehicle_1_year_of_initial_registration_inspection
  title: 車両1:初度登録年/検査年
  description: 車体の初度登録年を記入
- name: vehicle_1_seating_capacity
  title: 車両1:乗車定員
  description: 乗車定員を記入
- name: vehicle_1_load_at_the_time
  title: 車両1:当時の積載量
  description: '単位: kg。事故当時の積載量を記入'
- name: vehicle_1_maximum_load_capacity
  title: 車両1:最大積載量
  description: '単位: kg。最大積載量を記入'
- name: cargo_contents
  title: 貨物の内容
  description: 貨物自動車の場合、運搬していた貨物の内容を選択
- name: transport_of_hazardous_material
  title: 危険物の運搬の有無
