schema: links
name: coastal_shipping_port_pairs
title: 内航船舶輸送統計調査（積地・揚地の港の組）
description: |-
  内航船舶の輸送実態として、積地・揚地別の総トン数・載貨重量トン数、平均積載率・貨物の重量・輸送距離等に関する情報を有するデータ(47,510レコード) ※元データ(内航船舶輸送統計調査データ)には、元々「積地・揚地の港名(B,D列)」は付与されている一方で、「積地・揚地の都道府県名(C,E列)」は付与されていない。同一名の港湾が複数都道府県に存在する場合(例:鹿島港は茨城県と佐賀県に存在)には、正解データである正しい都道府県を判定することは難しいため、積地・揚地の都道府県名(C,E列)のセルをブランク(空欄)としている。 ※元データに積地・揚地の都道府県名(C,E列)は付与されていないため、国土数値情報の港湾データ(※1)をもとに、港湾名をキーとして都道府県名を付与。なお、元データの積地・揚地の港名(B,D列)のうち国土数値情報の港湾データに存在しないものはブランクとしている。 ※1:https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-C02-v3_2.html

  元の資料: 内航船舶輸送統計調査

  G空間情報センターのデータセット links-modalshift-2024 の 01_naikousenpakuyusoutoukeichousa.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
sources:
- path: https://www.geospatial.jp/ckan/dataset/links-modalshift-2024
