schema: links
name: trucking_financials_nara
title: 貨物自動車運送事業の財務情報（奈良運輸支局管内、2023年度）
description: |-
  奈良運輸支局管内の事業者を対象とした、営業費用、経常損益、流動・固定資産、負債・純資産等の財務情報を有するデータ(324レコード)

  G空間情報センターのデータセット links-kamotsujidousyaunsojigyo-2025 の 02_zaimujyouho_2025.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
sources:
