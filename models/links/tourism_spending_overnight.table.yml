schema: links
name: tourism_spending_overnight
title: 旅行・観光消費動向調査（宿泊旅行）
description: |-
  旅行・観光消費動向調査データをもとに、都道府県単位での国内宿泊旅行の費目別旅行消費額および旅行消費単価(団体・パックツアー料金、宿泊費、飲食費、交通費、娯楽サービス費、買い物代、その他)および宿泊数を、2021~2024年の時系列に集計を行いデータ化したものです(188レコード)。

  元の資料: 旅行・観光消費動向調査

  G空間情報センターのデータセット links_kankoutoukei_2025 の 02_ryokoukankousyouhidoukou_syukuhaku.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
sources:
- path: https://www.geospatial.jp/ckan/dataset/links_kankoutoukei_2025
fields:
- name: year
  title: 年
- name: prefecture_code
  title: 訪問地コード
  annotations:
    queria:
      semantic:
        role: entity
        name: prefecture
  description: 都道府県コード
