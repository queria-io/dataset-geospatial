schema: links
name: railway_income_statement
title: 鉄道統計年報 損益計算書
description: |-
  損益計算書は、鉄軌道業の営業収益・営業費・営業損益、自動車業の営業収益・営業費・営業損益、営業損益計、全事業経常利益、税引前損益、法人税等、当期損益、配当率に関する情報を有するデータです。(2,306レコード)

  元の資料: 鉄道統計年報

  G空間情報センターのデータセット links-tetsudoujigyou-2025 の 05_tetsudou_sonekikeisansyo.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
sources:
