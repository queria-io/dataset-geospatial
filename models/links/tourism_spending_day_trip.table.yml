schema: links
name: tourism_spending_day_trip
title: 旅行・観光消費動向調査（日帰り旅行）
description: |-
  旅行・観光消費動向調査データをもとに、都道府県単位での日帰り旅行の費目別旅行消費額および旅行消費単価(団体・パックツアー料金、宿泊費、飲食費、交通費、娯楽サービス費、買い物代、その他)を、2021~2024年の時系列に集計を行いデータ化したものです(188レコード)。

  元の資料: 旅行・観光消費動向調査

  G空間情報センターのデータセット links_kankoutoukei_2025 の 03_ryokoukankousyouhidoukou_higaeri.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
sources:
- path: https://www.geospatial.jp/ckan/dataset/links_kankoutoukei_2025
