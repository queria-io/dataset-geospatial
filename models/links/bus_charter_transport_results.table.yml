schema: links
name: bus_charter_transport_results
title: 一般貸切旅客自動車運送事業輸送実績報告（貸切バス）
description: |-
  貸切バスの輸送実績は、事業用自動車数、従業員数、運転者数、走行キロ、実車キロ、輸送人員、旅行業者扱い、営業収入、交通事故件数、死者数、負傷者数、1人平均乗車キロ、輸送人キロ、平均乗車密度等の実績に関する情報を、ランク化(閾値設定)により秘匿化したデータです。(6,055レコード)

  元の資料: 一般貸切旅客自動車運送事業輸送実績報告書

  G空間情報センターのデータセット links-ippanryokyaku-2025 の 02_ippankashikiriryokyaku_yusoujisseki.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
sources:
- path: https://www.geospatial.jp/ckan/dataset/links-ippanryokyaku-2025
