schema: links
name: port_survey
title: 港湾調査
description: |-
  港湾別の効率性や稼動性を判定するための、総トン数別の隻数や合計総トン数の集計データ、船舶の長さ別の移出入量に関する集計データ(1622レコード)

  元の資料: 港湾調査(様式NO.1 入港船舶集計表)、港湾調査(様式NO.3-3 海上貨物集計表(移出))、港湾調査(様式NO.3-4 海上貨物集計表(移入))、港湾調査(様式NO4-3 コンテナ個数・シャーシ台数集計表(移出))、港湾調査(様式NO4-4 コンテナ個数・シャーシ台数集計表(移入))

  G空間情報センターのデータセット links-naikoukaiungyou-2024 の 03_kouwanchousa.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
sources:
- path: https://www.geospatial.jp/ckan/dataset/links-naikoukaiungyou-2024
