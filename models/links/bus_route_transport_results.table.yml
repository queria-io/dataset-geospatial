schema: links
name: bus_route_transport_results
title: 一般乗合旅客自動車運送事業輸送実績報告（路線バス）
description: |-
  路線バスの輸送実績は、事業種別(路線定期運行、路線不定期運行、区域運行)、事業用自動車数、従業員数、運転者数、路線、競合路線、運行系統数、走行キロ、実車キロ、輸送人員、営業収入、旅客運賃収入、交通事故件数、死者数、負傷者数、1人平均乗車キロ、輸送人キロ、平均乗車密度等の実績に関する情報を、ランク化(閾値設定)により秘匿化したデータです。(3,517レコード)

  元の資料: 一般乗合旅客自動車運送事業輸送実績報告書

  G空間情報センターのデータセット links-ippanryokyaku-2025 の 01_ippannoriairyokyaku_yusoujisseki.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
sources:
- path: https://www.geospatial.jp/ckan/dataset/links-ippanryokyaku-2025
