schema: links
name: ship_accidents
title: 船舶事故等調査報告書
description: |-
  船舶事故等調査報告書から抽出した事故情報(事故種類、発生日時・場所、事故の概要、船舶の種類、死傷者等、気象・海象、事故の経過、原因、再発防止策 等)を有するデータ

  元の資料: 船舶事故等調査報告書、海上分布予報、地方海上予報区

  G空間情報センターのデータセット links-ippanryokyakuteikikourojigyou-2024 の 02_senpakujikohoukokusyo.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
sources:
- path: https://www.geospatial.jp/ckan/dataset/links-ippanryokyakuteikikourojigyou-2024
