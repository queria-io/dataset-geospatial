schema: links
name: warehouse_business_status
title: 倉庫事業経営状況報告書
description: |-
  倉庫経営状況として、倉庫保有棟数、貸借対照表(資産・負債、投資、自己株式等)、損益計算書(倉庫業収入・費用、倉庫業損益等)等に関する情報を有するデータ(2,095レコード)

  元の資料: 倉庫事業経営状況報告書

  G空間情報センターのデータセット links-soukogyou-2025 の 02_soukojigyou_keieijyoukyouhoukoku.csv を、列名を小文字にして型を付けたテーブルです。列の説明は同じデータセットのデータ仕様書から付けています。
sources:
- path: https://www.geospatial.jp/ckan/dataset/links-soukogyou-2025
