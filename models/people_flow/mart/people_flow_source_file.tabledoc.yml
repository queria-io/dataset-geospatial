$schema: https://tabledoc.queria.io/schemas/table/v1.json
title: 元のファイル
description: |-
  全国の人流オープンデータの配布物のうち、取り込んだ zip の一覧です。1 行が 1 つの zip で、取得した URL・掲載ページ・取得日時と、zip の sha256 を持ちます。

  - people_flow.mesh_population と people_flow.city_population_by_origin の source_sha256 がこのテーブルの sha256 を指します
  - zip 本体は保存していません。url から取得できます
primary_key: [file]
sources: [mlit-1km-fromto]
columns:
  - name: url
    title: zip の URL
  - name: page_url
    title: 掲載ページの URL
  - name: sha256
    title: zip の sha256
  - name: bytes
    title: バイト数
  - name: media_type
    title: メディアタイプ
  - name: retrieved_at
    title: 取得した日時
    description: UTC
  - name: etag
    title: ETag
    description: 取得したときの応答の ETag ヘッダー。無ければ NULL
  - name: last_modified
    title: Last-Modified
    description: 取得したときの応答の Last-Modified ヘッダー。無ければ NULL
  - name: file
    title: ファイル名
