schema: people_flow
name: city
title: 都道府県・市区町村と地方区分
description: |-
  滞在人口のデータに出てくる都道府県・市区町村の名前と、居住地区分に使う地方区分です。1 行が 1 市区町村です。

  - 地方区分は北海道・東北・関東・北陸・中部・近畿・中国・四国・九州・沖縄の 10 です
  - 2019 年のデータだけに出てくる旧那珂川町（40305）も入っています
primary_key: [city_code]
sources:
  - path: https://www.geospatial.jp/ckan/dataset/mlit-1km-fromto
licenses:
  - id: JP-MLIT-PEOPLE-FLOW
    url: https://www.geospatial.jp/ckan/dataset/mlit-1km-fromto/resource/5a3705d7-b321-4f33-b0d9-0c4c379e96c3
    title: 全国の人流オープンデータ利用規約（国土交通省、政府標準利用規約 2.0 準拠・CC BY 4.0 互換）
    commercial_use: true
    share_alike: false
    attribution_required: true
fields:
  - name: prefecture_code
    title: 都道府県コード
    description: 2 桁
    annotations: { queria: { semantic: { role: entity, name: prefecture } } }
  - name: prefecture
    title: 都道府県
    annotations: { queria: { semantic: { role: entity, name: prefecture } } }
  - name: city_code
    title: 市区町村コード（5 桁）
    description: 政令指定都市は区
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: lg_code
    title: 全国地方公共団体コード
    description: city_code に検査数字を付けた 6 桁
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: city_name
    title: 市区町村名
    description: 郡名つき（筑紫郡那珂川町）
  - name: address
    title: 都道府県と市区町村名
    description: 北海道札幌市中央区
  - name: region_code
    title: 地方区分コード
    description: 2 桁
    annotations: { queria: { semantic: { role: dimension } } }
  - name: region
    title: 地方区分
    annotations: { queria: { semantic: { role: dimension } } }
