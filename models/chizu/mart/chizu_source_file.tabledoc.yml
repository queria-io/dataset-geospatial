$schema: https://tabledoc.queria.io/schemas/table/v1.json
title: 取り込んだ地図データ
description: |-
  取り込んだ登記所備付地図データの一覧です。1 行が G空間情報センターの 1 データセット（市区町村の 1 登記所）の zip で、取得した URL・取得日時と、zip の sha256 を持ちます。

  - 使うときの出典には title と page_url を書いてください
  - chizu.parcel の source_sha256 がこのテーブルの sha256 を指します
  - zip 本体は保存していません。url から取得できます
primary_key: [file]
licenses:
  - JP-MOJ-CHIZU
columns:
  - name: url
    title: zip の URL
  - name: page_url
    title: ページ URL
    description: G空間情報センターのデータセットのページ。出典に書く URL
  - name: sha256
    title: zip の sha256
  - name: bytes
    title: バイト数
  - name: media_type
    title: メディアタイプ
  - name: retrieved_at
    title: 取得した日時
    description: UTC
  - name: etag
    title: ETag
    description: 取得したときの応答の ETag ヘッダー。無ければ NULL
  - name: last_modified
    title: Last-Modified
    description: 取得したときの応答の Last-Modified ヘッダー。無ければ NULL
  - name: file
    title: ファイル名
    description: 市区町村コード-登記所コード-年.zip
  - name: city_code
    title: 市区町村コード（5 桁）
    entity: city
  - name: lg_code
    title: 全国地方公共団体コード
    entity: city
  - name: registry_code
    title: 登記所コード
  - name: year
    title: 年
    description: データの年（ファイル名の末尾）
  - name: title
    title: データセット名
    description: G空間情報センターのデータセットの名前
