name: "geospatial"
version: "1.0.0"

profile: "geospatial"

model-paths: ["models"]
macro-paths: ["macros", "shared/macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  geospatial:
    +database: geospatial
    +materialized: table
    people_flow:
      # mesh_population（3,800 万行）は年月 → メッシュコードの順に並べ、行グループを 245,760 行（約 0.85MB）にする。
      # 1 か月の全国（約 100 万行）が 4〜5 個の行グループに、ある地域の 36 か月が月ごとに 1〜2 個の行グループに収まる。
      # 設定はスキーマに付く (dbt は __dbt_tmp に書いてから改名するので、テーブルに付けても効かない)
      # PR のビルド確認（ci/profiles.yml、target ci）は DuckLake でないので付けない
      +pre-hook:
        - "{{ \"CALL geospatial.set_option('parquet_row_group_size', 245760, schema => 'people_flow')\" if target.name != 'ci' else '' }}"
        - "{{ \"CALL geospatial.set_option('parquet_compression', 'zstd', schema => 'people_flow')\" if target.name != 'ci' else '' }}"
    chizu:
      # 市区町村で引くので、行グループを 16,384 行にする。全国 2.4 億筆・17.5GB で 1 つ 1MB 前後。
      # 設定はスキーマに付く (dbt は __dbt_tmp に書いてから改名するので、テーブルに付けても効かない)
      # PR のビルド確認（ci/profiles.yml、target ci）は DuckLake でないので付けない
      +pre-hook: "{{ \"CALL geospatial.set_option('parquet_row_group_size', 16384, schema => 'chizu')\" if target.name != 'ci' else '' }}"
